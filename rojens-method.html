<!DOCTYPE html>
<html>
<head>
    <title>Rojen's Method in Chemistry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #ccd5e0;
        }

        h1 {
            color: #1769aa;
        }

        .formula {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .box {
            background: #dcecff;
            padding: 25px;
            border-radius: 12px;
            font-size: 30px;
            font-weight: bold;
            color: #1769aa;
        }

        p {
            color: #555;
        }

        footer {
            margin-top: 25px;
            color: gray;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ROJEN'S METHOD</h1>
        <h3>Chemistry Learning Website</h3>

        <p>Welcome to Rojen's Method in Chemistry!</p>
        <p>Learn and understand chemistry formulas
        through a simple method.</p>

        <div class="formula">
            <div class="box">V₁</div>
            <div class="box">V₂</div>
            <div class="box">P₁</div>
            <div class="box">P₂</div>
        </div>

        <h3>Learn Chemistry the Easy Way!</h3>
        <p>Created by Rojen</p>

        <footer>
            © 2026 Rojen's Method in Chemistry
        </footer>
    </div>
</body>
